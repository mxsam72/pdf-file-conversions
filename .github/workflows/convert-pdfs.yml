name: Convert PDFs

on:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', 'settings.json', '.github/workflows/convert-pdfs.yml']
  workflow_dispatch:
    inputs:
      input_tag:
        description: 'Release tag containing the input ZIP'
        required: true
        default: inputs-test-001
      asset_name:
        description: 'Exact ZIP or split descriptor asset filename'
        required: true
        default: test-inputs.zip

permissions:
  contents: read

concurrency:
  group: pdf-conversion-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned conversion libraries on the GitHub runner
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run functional and upload boundary tests
        run: python -m unittest discover -p 'test_*.py' -v

  pilot:
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Download inputs and publish only this repository's result Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned conversion libraries on the GitHub runner
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Convert the pilot, validate it, and publish the result ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.input_tag }}
          INPUT_ASSET: ${{ inputs.asset_name }}
          PYTHONUNBUFFERED: '1'
        run: python cloud_run.py --publish
